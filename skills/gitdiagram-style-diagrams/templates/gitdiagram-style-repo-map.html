<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GitDiagram Style Template</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap');body{margin:0;font-family:"IBM Plex Sans",sans-serif;background:#0a0d14;color:#f8fafc;padding:28px}.wrap{max-width:1440px;margin:0 auto}.title{font-size:34px;font-weight:700}.sub{color:#a2aec2;margin:10px 0 18px}.panel{background:#101522;border:1px solid #242d43;border-radius:24px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.35)}svg{width:100%;display:block;height:auto}.tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#172033;border:1px solid #2a3a5d;color:#9fc0ff;font-size:12px;margin-bottom:12px}.small{font-size:12px;color:#a2aec2}</style></head><body><div class="wrap"><div class="tag">Repo → modules → flows → hotspots</div><div class="title">GitDiagram 风格 · 仓库结构视图</div><div class="sub">把这里的标题、模块、连接和分析卡片替换成你的项目内容。</div><div class="panel"><svg viewBox="0 0 1440 860" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ab4ff"/></marker></defs><rect x="40" y="50" width="1360" height="760" rx="24" fill="#0c111b" stroke="#1e293b"/><rect x="70" y="90" width="220" height="690" rx="18" fill="#121a2a" stroke="#26344d"/><text x="100" y="128" fill="#fff" font-size="22" font-weight="700">Repository</text><rect x="95" y="155" width="170" height="48" rx="12" fill="#1b2942" stroke="#35507d"/><text x="180" y="184" text-anchor="middle" fill="#dbeafe" font-size="16">apps/web</text><rect x="95" y="220" width="170" height="48" rx="12" fill="#1b2942" stroke="#35507d"/><text x="180" y="249" text-anchor="middle" fill="#dbeafe" font-size="16">apps/api</text><rect x="95" y="285" width="170" height="48" rx="12" fill="#1b2942" stroke="#35507d"/><text x="180" y="314" text-anchor="middle" fill="#dbeafe" font-size="16">packages/core</text><rect x="95" y="350" width="170" height="48" rx="12" fill="#1b2942" stroke="#35507d"/><text x="180" y="379" text-anchor="middle" fill="#dbeafe" font-size="16">packages/ui</text><rect x="95" y="415" width="170" height="48" rx="12" fill="#1b2942" stroke="#35507d"/><text x="180" y="444" text-anchor="middle" fill="#dbeafe" font-size="16">scripts/</text><text x="95" y="520" fill="#8da2c4" font-size="13">AI 先拿到的是仓库地图，</text><text x="95" y="545" fill="#8da2c4" font-size="13">不是流程图本身。</text><rect x="360" y="90" width="460" height="320" rx="18" fill="#121a2a" stroke="#26344d"/><text x="390" y="128" fill="#fff" font-size="22" font-weight="700">Module Graph</text><rect x="390" y="170" width="120" height="56" rx="14" fill="#10304c" stroke="#4d92d9"/><text x="450" y="202" text-anchor="middle" fill="#e0f2fe" font-size="16">Web UI</text><rect x="560" y="170" width="120" height="56" rx="14" fill="#17331f" stroke="#4ade80"/><text x="620" y="202" text-anchor="middle" fill="#dcfce7" font-size="16">API</text><rect x="720" y="170" width="70" height="56" rx="14" fill="#39291a" stroke="#f59e0b"/><text x="755" y="202" text-anchor="middle" fill="#fef3c7" font-size="15">DB</text><path d="M510 198H560" stroke="#8ab4ff" stroke-width="4" marker-end="url(#arr2)"/><path d="M680 198H720" stroke="#8ab4ff" stroke-width="4" marker-end="url(#arr2)"/><rect x="420" y="285" width="120" height="56" rx="14" fill="#28143f" stroke="#c084fc"/><text x="480" y="317" text-anchor="middle" fill="#f3e8ff" font-size="16">Core Logic</text><rect x="610" y="285" width="140" height="56" rx="14" fill="#12363a" stroke="#22d3ee"/><text x="680" y="317" text-anchor="middle" fill="#cffafe" font-size="16">Workflow Engine</text><path d="M480 226V285" stroke="#8ab4ff" stroke-width="4" marker-end="url(#arr2)"/><path d="M620 226V285" stroke="#8ab4ff" stroke-width="4" marker-end="url(#arr2)"/><path d="M750 226V285" stroke="#8ab4ff" stroke-width="4" marker-end="url(#arr2)"/><rect x="860" y="90" width="500" height="320" rx="18" fill="#121a2a" stroke="#26344d"/><text x="890" y="128" fill="#fff" font-size="22" font-weight="700">AI Understanding Output</text><rect x="890" y="170" width="210" height="62" rx="14" fill="#16243a" stroke="#44648f"/><text x="995" y="198" text-anchor="middle" fill="#fff" font-size="18">Entry Points</text><text x="995" y="218" text-anchor="middle" fill="#9db0cb" font-size="13">route.ts / controller / job</text><rect x="1130" y="170" width="190" height="62" rx="14" fill="#16243a" stroke="#44648f"/><text x="1225" y="198" text-anchor="middle" fill="#fff" font-size="18">Hot Paths</text><text x="1225" y="218" text-anchor="middle" fill="#9db0cb" font-size="13">auth / billing / sync</text><rect x="890" y="260" width="210" height="62" rx="14" fill="#16243a" stroke="#44648f"/><text x="995" y="288" text-anchor="middle" fill="#fff" font-size="18">Dependencies</text><text x="995" y="308" text-anchor="middle" fill="#9db0cb" font-size="13">who calls whom</text><rect x="1130" y="260" width="190" height="62" rx="14" fill="#16243a" stroke="#44648f"/><text x="1225" y="288" text-anchor="middle" fill="#fff" font-size="18">Change Risk</text><text x="1225" y="308" text-anchor="middle" fill="#9db0cb" font-size="13">blast radius / impact</text><rect x="360" y="450" width="1000" height="330" rx="18" fill="#121a2a" stroke="#26344d"/><text x="390" y="488" fill="#fff" font-size="22" font-weight="700">Then AI Turns It Into Action</text><path d="M520 580H720" stroke="#8ab4ff" stroke-width="5" marker-end="url(#arr2)"/><path d="M880 580H1080" stroke="#8ab4ff" stroke-width="5" marker-end="url(#arr2)"/><rect x="420" y="535" width="120" height="90" rx="16" fill="#10304c" stroke="#4d92d9"/><text x="480" y="575" text-anchor="middle" fill="#fff" font-size="18">理解仓库</text><text x="480" y="600" text-anchor="middle" fill="#9db0cb" font-size="13">repo map</text><rect x="720" y="535" width="160" height="90" rx="16" fill="#12363a" stroke="#22d3ee"/><text x="800" y="575" text-anchor="middle" fill="#fff" font-size="18">生成流程图</text><text x="800" y="600" text-anchor="middle" fill="#9db0cb" font-size="13">Mermaid / Eraser</text><rect x="1080" y="535" width="160" height="90" rx="16" fill="#17331f" stroke="#4ade80"/><text x="1160" y="575" text-anchor="middle" fill="#fff" font-size="18">写代码 + 验证</text><text x="1160" y="600" text-anchor="middle" fill="#9db0cb" font-size="13">implement + test</text><text x="420" y="690" fill="#9db0cb" font-size="15">这个风格不是“漂亮流程图优先”，而是“代码理解优先”。</text><text x="420" y="720" fill="#9db0cb" font-size="15">适合接手陌生仓库、复杂项目、需要先建立全局上下文的时候。</text></svg></div><div class="small">结论：GitDiagram 风更偏“仓库理解地图”，不是最适合展示业务流程的最终成品图，但很适合 AI coding 前置分析。</div></body></html>
